info:
  name: Delivery Code Webhook
  type: http
  seq: 3
  tags:
    - webhook

http:
  method: POST
  url: "{{baseUrl}}/v1/confirmationCode"
  headers:
    - name: X-App-Id
      value: ""
      description: Unique identifier of the **Logistic Service** sending the webhook.
    - name: X-App-MerchantId
      value: ""
      description: Unique identifier of the Merchant.
    - name: X-App-Signature
      value: ""
      description: HMAC-SHA256 signature of the request body, using the client secret as the key.
  body:
    type: json
    data: |-
      {
        "orderId": "6cc158a0-115b-4ed7-8c50-68971825d29e",
        "deliveryCode": "1234"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status code is a documented response", function () {
          expect([200, 400, 403]).to.include(res.getStatus());
        });

        if (res.getStatus() === 200) {
          test("200: acknowledges delivery code webhook", function () {
            expect(res.getHeader('content-type')).to.include('application/json');
            const body = res.getBody();
            expect(body).to.be.an('object');
            expect(body).to.have.property('status').that.is.a('string');
            expect(body).to.have.property('title').that.is.a('string');
          });
        }

        if (res.getStatus() === 400) {
          test("400: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 400);
          });
        }

        if (res.getStatus() === 403) {
          test("403: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 403);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/v1/confirmationCode"
