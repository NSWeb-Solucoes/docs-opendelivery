        - name: X-App-Signature
          value: ""
          description: HMAC-SHA256 signature of the request body, using the client secret as the key.
      body:
        type: json
        data: |-
          {
            "orderId": "6cc158a0-115b-4ed7-8c50-68971825d29e",
            "deliveryCode": "1234"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "200",
            "title": "Codigo de confirmacao processado com sucesso"
