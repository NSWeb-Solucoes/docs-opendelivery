  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/v1/confirmationCode"
      method: POST
      headers:
        - name: X-App-Id
          value: ""
          description: Unique identifier of the **Logistic Service** sending the webhook.
        - name: X-App-MerchantId
          value: ""
          description: Unique identifier of the Merchant.
        - name: X-App-Signature
          value: ""
          description: HMAC-SHA256 signature of the request body, using the client secret as the key.
      body:
        type: json
        data: |-
          {
            "orderId": "6cc158a0-115b-4ed7-8c50-68971825d29e",
            "deliveryCode": "1234"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: '{"title":"Código de confirmação inválido.","status":400}'
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/v1/confirmationCode"
      method: POST
      headers:
        - name: X-App-Id
          value: ""
          description: Unique identifier of the **Logistic Service** sending the webhook.
        - name: X-App-MerchantId
          value: ""
          description: Unique identifier of the Merchant.
        - name: X-App-Signature
          value: ""
          description: HMAC-SHA256 signature of the request body, using the client secret as the key.
      body:
        type: json
        data: |-
          {
            "orderId": "6cc158a0-115b-4ed7-8c50-68971825d29e",
            "deliveryCode": "1234"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: '{"title":"Invalid signature","status":403}'

docs: |-
  Sent by the **Logistic Service** to notify this **Software Service** of the delivery confirmation code informed by the customer, so it can be validated against the order.
  <br /><br />
  <span style="text-decoration:underline; color:#26323880; font-size:13.006px">HOST:</span> **SOFTWARE SERVICE**

  <span style="text-decoration:underline; color:#26323880; font-size:13.006px">DIRECTION:</span>
