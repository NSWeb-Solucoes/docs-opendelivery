info:
  name: New Order Event Notification (Webhook)
  type: http
  seq: 1
  tags:
    - webhook

http:
  method: POST
  url: "{{baseUrl}}/v1/newEvent"
  headers:
    - name: X-App-Id
      value: ""
      description: Unique identifier of the **Ordering Application** sending the webhook.
    - name: X-App-MerchantId
      value: ""
      description: Unique identifier of the Merchant.
    - name: X-App-Signature
      value: ""
      description: "HMAC-SHA256 signature of the request body, using the client secret as the key. Accepted as an alternative to a bearer token (`Authorization: Bearer`)."
      disabled: true
  body:
    type: json
    data: |-
      {
        "eventId": "ad0fcc48-abba-4491-a017-94f5a145c281",
        "eventType": "CREATED",
        "orderId": "a9c93a8c-1b16-4960-b2f6-908aff3d3f2d",
        "orderURL": "https://cardapio.pedizap.com.br/opendelivery/v1/orders/a9c93a8c-1b16-4960-b2f6-908aff3d3f2d",
        "createdAt": "2026-07-16T15:22:02.000Z"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status code is a documented response", function () {
          expect([200, 400, 401]).to.include(res.getStatus());
        });

        if (res.getStatus() === 200) {
          test("200: acknowledges new order event webhook", function () {
            expect(res.getHeader('content-type')).to.include('application/json');
            const body = res.getBody();
            expect(body).to.be.an('object');
            expect(body).to.have.property('status').that.is.a('string');
            expect(body).to.have.property('title').that.is.a('string');
          });
        }

        if (res.getStatus() === 400) {
          test("400: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 400);
          });
        }

        if (res.getStatus() === 401) {
          test("401: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 401);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

