docs: |-
  Webhook alternative to [GET /v1/events](#operation/users_macuser_work_open_delivery_api_orders_events_get_new_events_yml) polling: sent by the **Ordering Application** to notify this **Software Service** that a new order event has happened, avoiding the need to poll.

  > **Acknowledgment does NOT apply for webhooks.**

