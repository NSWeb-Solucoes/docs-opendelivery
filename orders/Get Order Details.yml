info:
  name: Get Order Details
  type: http
  seq: 1
  tags:
    - orders

http:
  method: GET
  url: "{{baseUrl}}/v1/orders/:orderId"
  params:
    - name: orderId
      value: "{{order_id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status code is a documented response", function () {
          expect([200, 400, 401, 404]).to.include(res.getStatus());
        });

        if (res.getStatus() === 200) {
          test("200: returns order details", function () {
            expect(res.getHeader('content-type')).to.include('application/json');
            const body = res.getBody();
            expect(body).to.be.an('object');
            expect(body).to.have.property('id').that.is.a('string');
            expect(body).to.have.property('type').that.is.a('string');
            expect(body).to.have.property('displayId').that.is.a('string');
            expect(body).to.have.property('sourceAppId').that.is.a('string');
            expect(body).to.have.property('category').that.is.a('string');
            expect(body).to.have.property('createdAt').that.is.a('string');
            expect(body).to.have.property('lastEvent').that.is.a('string');
            expect(body).to.have.property('items').that.is.a('array');
            expect(body).to.have.property('total').that.is.a('object');
            expect(body).to.have.property('payments').that.is.a('object');
            expect(body).to.have.property('customer').that.is.a('object');
            expect(body).to.have.property('delivery').that.is.a('object');
          });
        }

        if (res.getStatus() === 400) {
          test("400: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 400);
          });
        }

        if (res.getStatus() === 401) {
          test("401: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 401);
          });
        }

        if (res.getStatus() === 404) {
          test("404: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 404);
          });
        }

