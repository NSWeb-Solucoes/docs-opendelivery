info:
  name: Patch Order Details
  type: http
  seq: 2
  tags:
    - orders

http:
  method: PATCH
  url: "{{baseUrl}}/v1/orders/:orderId"
  params:
    - name: orderId
      value: "{{order_id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "preparationStartDateTime": "2026-07-17T15:23:13.000Z"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status code is a documented response", function () {
          expect([200, 400, 401, 404]).to.include(res.getStatus());
        });

        if (res.getStatus() === 200) {
          test("200: accepts order details patch with no content", function () {
            const body = res.getBody();
            expect(body === undefined || body === null || body === '').to.be.true;
          });
        }

        if (res.getStatus() === 400) {
          test("400: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 400);
          });
        }

        if (res.getStatus() === 401) {
          test("401: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 401);
          });
        }

        if (res.getStatus() === 404) {
          test("404: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 404);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/v1/orders/:orderId"
      method: PATCH
      params:
        - name: orderId
          value: "{{order_id}}"
          type: path
      body:
        type: json
        data: |-
          {
            "preparationStartDateTime": "2026-07-17T15:23:13.000Z"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/v1/orders/:orderId"
      method: PATCH
      params:
        - name: orderId
          value: "{{order_id}}"
          type: path
      body:
        type: json
        data: |-
          {
            "preparationStartDateTime": "2026-07-17T15:23:13.000Z"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: '{"title":"preparationStartDateTime obrigatório","status":400}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/v1/orders/:orderId"
      method: PATCH
      params:
        - name: orderId
          value: "{{order_id}}"
          type: path
      body:
        type: json
        data: |-
          {
            "preparationStartDateTime": "2026-07-17T15:23:13.000Z"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: '{"title":"Unauthorized","status":401}'
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/v1/orders/:orderId"
      method: PATCH
      params:
        - name: orderId
          value: "{{order_id}}"
          type: path
      body:
        type: json
        data: |-
          {
            "preparationStartDateTime": "2026-07-17T15:23:13.000Z"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: '{"title":"Pedido não encontrado","status":404}'

