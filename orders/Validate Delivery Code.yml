info:
  name: Validate Delivery Code
  type: http
  seq: 3
  tags:
    - orders

http:
  method: POST
  url: "{{baseUrl}}/v1/orders/:orderId/validateCode/:deliveryCode"
  params:
    - name: orderId
      value: "{{order_id}}"
      type: path
    - name: deliveryCode
      value: "1234"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status code is a documented response", function () {
          expect([200, 400, 401, 404]).to.include(res.getStatus());
        });

        if (res.getStatus() === 200) {
          test("200: returns validated delivery code", function () {
            expect(res.getHeader('content-type')).to.include('application/json');
            const body = res.getBody();
            expect(body).to.be.an('object');
            expect(body).to.have.property('orderId').that.is.a('string');
            expect(body).to.have.property('deliveryCode').that.is.a('string');
          });
        }

        if (res.getStatus() === 400) {
          test("400: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 400);
          });
        }

        if (res.getStatus() === 401) {
          test("401: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 401);
          });
        }

        if (res.getStatus() === 404) {
          test("404: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 404);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/v1/orders/:orderId/validateCode/:deliveryCode"
      method: POST
      params:
        - name: orderId
          value: "{{order_id}}"
          type: path
        - name: deliveryCode
          value: "1234"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "orderId": "6cc158a0-115b-4ed7-8c50-68971825d29e",
            "deliveryCode": "1234"
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/v1/orders/:orderId/validateCode/:deliveryCode"
      method: POST
      params:
        - name: orderId
          value: "{{order_id}}"
          type: path
        - name: deliveryCode
          value: "1234"
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: '{"title":"Código de entrega inválido","status":400}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/v1/orders/:orderId/validateCode/:deliveryCode"
      method: POST
      params:
        - name: orderId
          value: "{{order_id}}"
          type: path
        - name: deliveryCode
          value: "1234"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: '{"title":"Unauthorized","status":401}'
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/v1/orders/:orderId/validateCode/:deliveryCode"
      method: POST
      params:
        - name: orderId
          value: "{{order_id}}"
          type: path
        - name: deliveryCode
          value: "1234"
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: '{"title":"Pedido não encontrado","status":404}'

