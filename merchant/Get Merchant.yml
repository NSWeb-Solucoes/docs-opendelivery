docs: |-
  Returns the full **Merchant** object (basic info, services and catalog: items, menus, categories, item offers and availabilities) registered in the **Ordering Application**.

  Called by the **Software Service** using the URL registered via [PUT /v1/merchantOnboarding](#operation/register_update_merchant_endpoint_info) (`getMerchantURL.baseURL`), authenticating with the `apiKey` sent in that same registration (header `X-API-KEY`).
  <br /><br />
  <span style="text-decoration:underline; color:#26323880; font-size:13.006px">HOST:</span> **ORDERING APPLICATION**

  <span style="text-decoration:underline; color:#26323880; font-size:13.006px">DIRECTION:</span>
