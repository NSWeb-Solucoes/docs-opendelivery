info:
  name: Get Merchant
  type: http
  seq: 3
  tags:
    - merchant

http:
  method: GET
  url: "{{baseUrl}}/v1/merchant"
  headers:
    - name: X-API-KEY
      value: "{{apiKey}}"
  auth:
    type: apikey
    key: X-API-KEY
    value: "{{apiKey}}"
    placement: header

runtime:
  scripts:
    - type: tests
      code: |-
        test("status code is a documented response", function () {
          expect([200, 403]).to.include(res.getStatus());
        });

        if (res.getStatus() === 200) {
          test("200: returns full merchant payload", function () {
            expect(res.getHeader('content-type')).to.include('application/json');
            const body = res.getBody();
            expect(body).to.be.an('object');
            expect(body).to.have.property('id').that.is.a('string');
            expect(body).to.have.property('status').that.is.a('string');
            expect(body).to.have.property('basicInfo').that.is.a('object');
            expect(body).to.have.property('services').that.is.a('array');
            expect(body).to.have.property('items').that.is.a('array');
            expect(body).to.have.property('menus').that.is.a('array');
            expect(body).to.have.property('categories').that.is.a('array');
            expect(body).to.have.property('itemOffers').that.is.a('array');
            expect(body).to.have.property('availabilities').that.is.a('array');
          });
        }

        if (res.getStatus() === 403) {
          test("403: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 403);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

