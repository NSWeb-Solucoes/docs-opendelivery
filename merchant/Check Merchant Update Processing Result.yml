info:
  name: Check Merchant Update Processing Result
  type: http
  seq: 1
  tags:
    - merchant

http:
  method: GET
  url: "{{baseUrl}}/v1/merchantStatus?merchantId=:{merchant_id}"
  params:
    - name: merchantId
      value: "{{merchant_id}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status code is a documented response", function () {
          expect([200, 401, 404]).to.include(res.getStatus());
        });

        if (res.getStatus() === 200) {
          test("200: returns merchant update status", function () {
            expect(res.getHeader('content-type')).to.include('application/json');
            const body = res.getBody();
            expect(body).to.be.an('object');
            expect(body).to.have.property('lastRead').that.is.a('string');
            expect(body).to.have.property('status').that.is.a('string');
            expect(body).to.have.property('moreInfo').that.is.a('string');
          });
        }

        if (res.getStatus() === 401) {
          test("401: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 401);
          });
        }

        if (res.getStatus() === 404) {
          test("404: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 404);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/v1/merchantStatus?merchantId=:{merchant_id}"
      method: GET
      params:
        - name: merchantId
          value: "{{merchant_id}}"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "lastRead": "2026-07-16T11:01:59.000Z",
            "status": "SUCCESS",
            "moreInfo": ""
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/v1/merchantStatus?merchantId=:{merchant_id}"
      method: GET
      params:
        - name: merchantId
          value: "{{merchant_id}}"
          type: query
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: '{"title":"Unauthorized","status":401}'
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/v1/merchantStatus?merchantId=:{merchant_id}"
      method: GET
      params:
        - name: merchantId
          value: "{{merchant_id}}"
          type: query
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: '{"title":"Merchant n\u00e3o encontrado","status":404}'

docs: |-
  Returns the result of the merchant update processing, whether triggered by a direct GET /merchant request or by receiving a merchant update via webhook.

  Use this endpoint to verify the status and outcome of the last merchant update attempt, including success, failure, or processing state.

