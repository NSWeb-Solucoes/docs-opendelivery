components:
  schemas:
    get_access_token:
      type: object
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        grant_type:
          type: string
    acknowledge_events:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          orderId:
            type: string
          eventType:
            type: string
      example:
        - id: ad0fcc48-abba-4491-a017-94f5a145c281
          orderId: a9c93a8c-1b16-4960-b2f6-908aff3d3f2d
          eventType: CREATED
    merchant_update_webhook:
      type: object
      properties:
        entityType:
          type: string
        updatedObjects:
          type: array
          items:
            type: object
      example:
        entityType: AVAILABILITY
        updatedObjects:
          - {}
    register_update_merchant_endpoint_info:
      type: object
      properties:
        getMerchantURL:
          type: object
          properties:
            baseURL:
              type: string
            apiKey:
              type: string
        ordersWebhookURL:
          type: string
        orderingAppMerchantId:
          type: string
      example:
        getMerchantURL:
          baseURL: https://cardapioqrcode.pedizap.com.br
          apiKey: 72f66d1e25e5e5a5d04035cdb7e87e19
        ordersWebhookURL: https://cardapioqrcode.pedizap.com.br/opendelivery/v1/newEvent
        orderingAppMerchantId: '{{merchant_id}}'
    confirm:
      type: object
      properties:
        reason:
          type: string
        createdAt:
          type: string
        orderExternalCode:
          type: string
        preparationTime:
          type: integer
      example:
        reason: string
        createdAt: '2026-06-03T16:34:41.300Z'
        orderExternalCode: '{{order_id}}'
        preparationTime: 0
    deny_order_cancellation:
      type: object
      properties:
        reason:
          type: string
        code:
          type: string
      example:
        reason: Motivo
        code: DISH_ALREADY_DONE
    dispatch:
      type: object
      properties:
        deliveryTrackingInfo:
          type: object
      example:
        deliveryTrackingInfo: {}
    patch_order_details:
      type: object
      properties:
        preparationStartDateTime:
          type: string
      example:
        preparationStartDateTime: '2026-07-17T15:23:13.000Z'
    request_order_cancellation:
      type: object
      properties:
        reason:
          type: string
        code:
          type: string
        mode:
          type: string
        outOfStockItems:
          type: array
          items:
            type: string
        invalidItems:
          type: array
          items:
            type: string
      example:
        reason: Reason
        code: DUPLICATE_APPLICATION
        mode: AUTO
        outOfStockItems: []
        invalidItems: []
    tracking:
      type: object
      properties:
        deliveryTrackingInfo:
          type: object
      example:
        deliveryTrackingInfo: {}
    delivery_code_webhook:
      type: object
      properties:
        orderId:
          type: string
        deliveryCode:
          type: string
      example:
        orderId: 6cc158a0-115b-4ed7-8c50-68971825d29e
        deliveryCode: '1234'
    new_order_event_notification_webhook:
      type: object
      properties:
        eventId:
          type: string
        eventType:
          type: string
        orderId:
          type: string
        orderURL:
          type: string
        createdAt:
          type: string
      example:
        eventId: ad0fcc48-abba-4491-a017-94f5a145c281
        eventType: CREATED
        orderId: a9c93a8c-1b16-4960-b2f6-908aff3d3f2d
        orderURL: >-
          https://cardapio.pedizap.com.br/opendelivery/v1/orders/a9c93a8c-1b16-4960-b2f6-908aff3d3f2d
        createdAt: '2026-07-16T15:22:02.000Z'
    tracking_event_webhook:
      type: object
      properties:
        orderId:
          type: string
        externalTrackingURL:
          type: string
        customerName:
          type: string
        event:
          type: object
          properties:
            type:
              type: string
        vehicle:
          type: object
          properties:
            type:
              type: string
        deliveryPerson:
          type: object
          properties:
            name:
              type: string
            phone:
              type: string
      example:
        orderId: 6cc158a0-115b-4ed7-8c50-68971825d29e
        externalTrackingURL: https://tracking.example.com/6cc158a0
        customerName: Fulano da Silva
        event:
