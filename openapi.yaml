openapi: 3.0.0
info:
  title: openapi
  version: 1.0.0
paths:
  /oauth/token:
    post:
      summary: Get Access Token
      operationId: users_macuser_work_open_delivery_api_authentication_get_access_token_yml
      description: >-
        Requests new access token for accessing **Ordering Application** API
        resources.

        <br /><br />

        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">HOST:</span> **ORDERING APPLICATION**


        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">DIRECTION:</span>

        <div align="center">
          <img src="https://abrasel-nacional.github.io/opendelivery/images/directionPOSTSS_OA.png" />
        </div>
      tags:
        - authentication
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
              example:
                access_token: >-
                  eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..UNVBuw-AqyE5HQ2cz9sMhWUmKxst11rzsdrYameRkVg
                token_type: bearer
                expires_in: 21600
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: grant_type invalido
                status: 400
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Credenciais invalidas
                status: 401
      requestBody:
        $ref: '#/components/requestBodies/get_access_token'
  /v1/events/acknowledgment:
    post:
      summary: Acknowledge Events
      operationId: users_macuser_work_open_delivery_api_events_acknowledge_events_yml
      description: >-
        Acknowledge a set of events, dismissing them from future polling calls.

        <br /><br />

        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">HOST:</span> **ORDERING APPLICATION**


        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">DIRECTION:</span>

        <div align="center">
          <img src="https://abrasel-nacional.github.io/opendelivery/images/directionPOSTSS_OA.png" />
        </div>
      tags:
        - events
      responses:
        '202':
          description: Accepted
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Payload inválido
                status: 400
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Unauthorized
                status: 401
      requestBody:
        $ref: '#/components/requestBodies/acknowledge_events'
      security:
        - acknowledge_events: []
  /v1/events:
    get:
      summary: Get New Events
      operationId: users_macuser_work_open_delivery_api_events_get_new_events_yml
      description: >-
        Polls events for any orders from merchants associated with the
        authenticated user.  

        Each event received from this endpoint must be properly acknowledged,
        otherwise it will continue to be returned on further requests.


        <br /><br />

        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">HOST:</span> **ORDERING APPLICATION**


        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">DIRECTION:</span>

        <div align="center">
          <img src="https://abrasel-nacional.github.io/opendelivery/images/directionGETSS_OA.png" />
        </div>
      tags:
        - events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    eventId:
                      type: string
                    eventType:
                      type: string
                    orderId:
                      type: string
                    orderURL:
                      type: string
                    createdAt:
                      type: string
                    sourceAppId:
                      type: string
                    virtualBrand:
                      type: string
              example:
                - eventId: ad0fcc48-abba-4491-a017-94f5a145c281
                  eventType: CREATED
                  orderId: a9c93a8c-1b16-4960-b2f6-908aff3d3f2d
                  orderURL: >-
                    https://cardapio.pedizap.com.br/opendelivery/v1/orders/a9c93a8c-1b16-4960-b2f6-908aff3d3f2d
                  createdAt: '2026-07-16T15:22:02.000Z'
                  sourceAppId: 123e4567-e89b-412d-a456-426614174000
                  virtualBrand: pedizap-5095
                - eventId: 88f0597a-87a0-41c8-810d-5efbe2acd198
                  eventType: CREATED
                  orderId: 6cc158a0-115b-4ed7-8c50-68971825d29e
                  orderURL: >-
                    https://cardapio.pedizap.com.br/opendelivery/v1/orders/6cc158a0-115b-4ed7-8c50-68971825d29e
                  createdAt: '2026-07-16T15:23:13.000Z'
                  sourceAppId: 123e4567-e89b-412d-a456-426614174000
                  virtualBrand: pedizap-5095
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Unauthorized
                status: 401
      parameters:
        - name: eventType
          in: query
          description: ''
          required: false
          schema:
            type: string
            enum:
              - CREATED
              - CONFIRMED
              - PREPARATION_REQUESTED
              - PREPARING
              - DISPATCHED
              - READY_FOR_PICKUP
              - PICKUP_AREA_ASSIGNED
              - PICKED_UP
              - DELIVERED
              - CONCLUDED
              - CANCELLATION_REQUESTED
              - CANCELLATION_REQUEST_DENIED
              - CANCELLED
              - ORDER_CANCELLATION_REQUEST
              - CANCELLED_DENIED
        - name: x-polling-merchants
          in: header
          description: ''
          required: true
          schema:
            type: string
          example: 22815773000169-dbc7e35a-c936-4665-9e13-eb55eb8b6824
      security:
        - get_new_events: []
  /v1/merchantStatus?merchantId=:{merchant_id}:
    get:
      summary: Check Merchant Update Processing Result
      operationId: >-
        users_macuser_work_open_delivery_api_merchant_check_merchant_update_processing_result_yml
      description: >-
        Returns the result of the merchant update processing, whether triggered
        by a direct GET /merchant request or by receiving a merchant update via
        webhook.


        Use this endpoint to verify the status and outcome of the last merchant
        update attempt, including success, failure, or processing state.


        <br /><br />

        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">HOST:</span> **ORDERING APPLICATION**


        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">DIRECTION:</span>

        <div align="center">
          <img src="https://abrasel-nacional.github.io/opendelivery/images/directionGETSS_OA.png" />
        </div>
      tags:
        - merchant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastRead:
                    type: string
                  status:
                    type: string
                  moreInfo:
                    type: string
              example:
                lastRead: '2026-07-16T11:01:59.000Z'
                status: SUCCESS
                moreInfo: ''
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Unauthorized
                status: 401
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Merchant não encontrado
                status: 404
      parameters:
        - name: merchantId
          in: query
          description: ''
          required: true
          schema:
            type: string
          example: '{{merchant_id}}'
        - name: merchant_id
          in: path
          description: ''
          required: true
          schema:
            type: string
      security:
        - check_merchant_update_processing_result: []
  /v1/merchant/:id/status:
    get:
      summary: Get Merchant Status and Service Hours
      operationId: >-
        users_macuser_work_open_delivery_api_merchant_get_merchant_status_and_service_hours_yml
      description: >-
        Returns the merchant status, service hours (serviceHours), and
        sourceAppId.

        <br /><br />

        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">HOST:</span> **SOFTWARE SERVICE**


        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">DIRECTION:</span>

        <div align="center">
          <img src="https://abrasel-nacional.github.io/opendelivery/versions/rc/images/directionGETSS_OA.png" />
        </div>
      tags:
        - merchant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        serviceType:
                          type: string
                        serviceHours:
                          type: array
                          items:
                            type: object
                            properties:
                              weekHours:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    dayOfWeek:
                                      type: array
                                      items:
                                        type: string
                                    timePeriods:
                                      type: object
                                      properties:
                                        startTime:
                                          type: string
                                        endTime:
                                          type: string
                              holidayHours:
                                type: array
                                items:
                                  type: string
                  orderingAppMerchantId:
                    type: string
              example:
                status: AVAILABLE
                services:
                  - id: service-16
                    serviceType: DELIVERY
                    serviceHours:
                      - weekHours:
                          - dayOfWeek:
                              - SUNDAY
                              - MONDAY
                              - TUESDAY
                              - WEDNESDAY
                              - THURSDAY
                              - FRIDAY
                              - SATURDAY
                            timePeriods:
                              startTime: 00:00:00.000Z
                              endTime: 23:59:00.000Z
                        holidayHours: []
                  - id: service-31
                    serviceType: DELIVERY
                    serviceHours:
                      - weekHours:
                          - dayOfWeek:
                              - SUNDAY
                              - MONDAY
                              - TUESDAY
                              - WEDNESDAY
                              - THURSDAY
                              - FRIDAY
                              - SATURDAY
                            timePeriods:
                              startTime: 00:00:00.000Z
                              endTime: 23:59:00.000Z
                        holidayHours: []
                  - id: service-32
                    serviceType: DELIVERY
                    serviceHours:
                      - weekHours:
                          - dayOfWeek:
                              - SUNDAY
                              - MONDAY
                              - TUESDAY
                              - WEDNESDAY
                              - THURSDAY
                              - FRIDAY
                              - SATURDAY
                            timePeriods:
                              startTime: 00:00:00.000Z
                              endTime: 23:59:00.000Z
                        holidayHours: []
                orderingAppMerchantId: 123e4567-e89b-412d-a456-426614174000
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Unauthorized
                status: 401
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Merchant não encontrado
                status: 404
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: string
          example: '{{merchant_id}}'
      security:
        - get_merchant_status_and_service_hours: []
  /v1/merchant:
    get:
      summary: Get Merchant
      operationId: users_macuser_work_open_delivery_api_merchant_get_merchant_yml
      description: >-
        Returns the full **Merchant** object (basic info, services and catalog:
        items, menus, categories, item offers and availabilities) registered in
        the **Ordering Application**.


        Called by the **Software Service** using the URL registered via [PUT
        /v1/merchantOnboarding](#operation/register_update_merchant_endpoint_info)
        (`getMerchantURL.baseURL`), authenticating with the `apiKey` sent in
        that same registration (header `X-API-KEY`).

        <br /><br />

        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">HOST:</span> **ORDERING APPLICATION**


        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">DIRECTION:</span>

        <div align="center">
          <img src="https://abrasel-nacional.github.io/opendelivery/images/directionGETSS_OA.png" />
        </div>
      tags:
        - merchant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastUpdate:
                    type: string
                  TTL:
                    type: integer
                  id:
                    type: string
                  status:
                    type: string
                  basicInfo:
                    type: object
                    properties:
                      name:
                        type: string
                      contactEmails:
                        type: array
                        items:
                          type: string
                      contactPhones:
                        type: object
                        properties:
                          commercialNumber:
                            type: string
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                        serviceType:
                          type: string
                        menuId:
                          type: string
                        serviceHours:
                          type: object
                          properties:
                            id:
                              type: string
                            weekHours:
                              type: array
                              items:
                                type: object
                                properties:
                                  dayOfWeek:
                                    type: array
                                    items:
                                      type: string
                                  timePeriods:
                                    type: object
                                    properties:
                                      startTime:
                                        type: string
                                      endTime:
                                        type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        externalCode:
                          type: string
                        image:
                          type: object
                          properties:
                            URL:
                              type: string
                        unit:
                          type: string
                  menus:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        externalCode:
                          type: string
                        categoryId:
                          type: array
                          items:
                            type: string
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        index:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                        externalCode:
                          type: string
                        status:
                          type: string
                        availabilityId:
                          type: array
                          items:
                            type: string
                        itemOfferId:
                          type: array
                          items:
                            type: string
                  itemOffers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        itemId:
                          type: string
                        index:
                          type: integer
                        price:
                          type: object
                          properties:
                            value:
                              type: integer
                            originalValue:
                              type: integer
                            currency:
                              type: string
                        availabilityId:
                          type: array
                          items:
                            type: string
                        optionGroupsId:
                          type: array
                          items:
                            type: string
                  optionGroups:
                    type: array
                    items:
                      type: string
                  availabilities:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        hours:
                          type: array
                          items:
                            type: object
                            properties:
                              dayOfWeek:
                                type: array
                                items:
                                  type: string
                              timePeriods:
                                type: object
                                properties:
                                  startTime:
                                    type: string
                                  endTime:
                                    type: string
              example:
                lastUpdate: '2026-07-17T12:00:00.000Z'
                TTL: 500
                id: 123e4567-e89b-412d-a456-426614174000
                status: AVAILABLE
                basicInfo:
                  name: Cardapio
                  contactEmails:
                    - contato@cardapio.com.br
                  contactPhones:
                    commercialNumber: '14991618018'
                services:
                  - id: service-16
                    status: AVAILABLE
                    serviceType: DELIVERY
                    menuId: menu-106
                    serviceHours:
                      id: sh-16
                      weekHours:
                        - dayOfWeek:
                            - SUNDAY
                            - MONDAY
                            - TUESDAY
                            - WEDNESDAY
                            - THURSDAY
                            - FRIDAY
                            - SATURDAY
                          timePeriods:
                            startTime: 00:00:00.000Z
                            endTime: 23:59:00.000Z
                items:
                  - id: '17'
                    name: Picole de Creme
                    description: ''
                    externalCode: prod-000017
                    image:
                      URL: https://cardapio.pedizap.com.br/uploads/product/17.jpg
                    unit: UN
                menus:
                  - id: menu-106
                    name: Cardapio
                    description: ''
                    externalCode: '106'
                    categoryId:
                      - '5'
                categories:
                  - id: '5'
                    index: 0
                    name: Sorvetes
                    description: ''
                    externalCode: '5'
                    status: AVAILABLE
                    availabilityId:
                      - avail-106
                    itemOfferId:
                      - offer-17
                itemOffers:
                  - id: offer-17
                    itemId: '17'
                    index: 0
                    price:
                      value: 6
                      originalValue: 6
                      currency: BRL
                    availabilityId:
                      - avail-106
                    optionGroupsId: []
                optionGroups: []
                availabilities:
                  - id: avail-106
                    hours:
                      - dayOfWeek:
                          - SUNDAY
                          - MONDAY
                          - TUESDAY
                          - WEDNESDAY
                          - THURSDAY
                          - FRIDAY
                          - SATURDAY
                        timePeriods:
                          startTime: 00:00:00.000Z
                          endTime: 23:59:00.000Z
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Invalid apiKey
                status: 403
      parameters:
        - name: X-API-KEY
          in: header
          description: ''
          required: true
          schema:
            type: string
          example: '{{apiKey}}'
  /v1/merchantUpdate?merchantId=:{merchant_id}:
    post:
      summary: Merchant Update Webhook
      operationId: >-
        users_macuser_work_open_delivery_api_merchant_merchant_update_webhook_yml
      description: >-
        Notifies the **Ordering Application** that merchant data changed on the
        **Software Service** side (full merchant refresh, entity-scoped catalog
        update, or merchantStatus change), so it can be synced.


        > When `entityType` is omitted (or is `MERCHANT`), the **Ordering
        Application** re-fetches the merchant via [GET
        /v1/merchant](#operation/users_macuser_work_open_delivery_api_merchant_get_merchant_yml).
        When `entityType` is present, only the `updatedObjects` for that entity
        are applied.


        <br /><br />

        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">HOST:</span> **ORDERING APPLICATION**


        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">DIRECTION:</span>

        <div align="center">
          <img src="https://abrasel-nacional.github.io/opendelivery/images/directionPOSTSS_OA.png" />
        </div>
      tags:
        - merchant
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Payload inválido
                status: 400
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Unauthorized
                status: 401
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Merchant não encontrado
                status: 404
      parameters:
        - name: merchantId
          in: query
          description: ''
          required: true
          schema:
            type: string
          example: '{{merchant_id}}'
        - name: merchant_id
          in: path
          description: ''
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/merchant_update_webhook'
      security:
        - merchant_update_webhook: []
  /v1/merchantOnboarding?merchantId=:{merchant_id}:
    put:
      summary: Register / Update Merchant endpoint info.
      operationId: >-
        users_macuser_work_open_delivery_api_merchant_register_-_update_merchant_endpoint_info_yml
      description: >-
        Register and update the **Merchant** endpoint [GET
        /v1/merchant](#operation/getMerchant) information in the **Ordering
        Application**.

        <br /><br />

        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">HOST:</span> **ORDERING APPLICATION**


        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">DIRECTION:</span>

        <div align="center">
          <img src="https://abrasel-nacional.github.io/opendelivery/images/directionPUTSS_OA.png" />
        </div>
      tags:
        - merchant
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Payload inválido
                status: 400
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: integer
              example:
                title: Unauthorized
                status: 401
      parameters:
        - name: merchantId
          in: query
          description: ''
          required: true
          schema:
            type: string
          example: '{{merchant_id}}'
        - name: merchant_id
          in: path
          description: ''
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/register_update_merchant_endpoint_info'
      security:
        - register_update_merchant_endpoint_info: []
  /v1/orders/:orderId/acceptCancellation:
    post:
      summary: Accept order cancellation
      operationId: >-
        users_macuser_work_open_delivery_api_orders_accept_order_cancellation_yml
      description: >-
        Informs the **Ordering Application** that the cancellation request has
        been accepted and the order can be Cancelled.


        > It is expected to receive a `CANCELLED` event after this action.


        <br /><br />

        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">HOST:</span> **ORDERING APPLICATION**


        <span style="text-decoration:underline; color:#26323880;
        font-size:13.006px">DIRECTION:</span>

        <div align="center">
