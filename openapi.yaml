          schema:
            $ref: '#/components/schemas/tracking'
      description: ''
      required: true
    delivery_code_webhook:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/delivery_code_webhook'
      description: ''
      required: true
    new_order_event_notification_webhook:
      content:
