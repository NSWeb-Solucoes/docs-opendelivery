      value: CANCELLED_DENIED
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status code is a documented response", function () {
          expect([200, 204, 401]).to.include(res.getStatus());
        });

        if (res.getStatus() === 200) {
          test("200: returns pending events", function () {
            expect(res.getHeader('content-type')).to.include('application/json');
            const body = res.getBody();
            expect(body).to.be.an('array');
            if (body.length > 0) {
              const item = body[0];
              expect(item).to.have.property('eventId').that.is.a('string');
              expect(item).to.have.property('eventType').that.is.a('string');
              expect(item).to.have.property('orderId').that.is.a('string');
              expect(item).to.have.property('orderURL').that.is.a('string');
              expect(item).to.have.property('createdAt').that.is.a('string');
              expect(item).to.have.property('sourceAppId').that.is.a('string');
            }
          });
        }

        if (res.getStatus() === 204) {
          test("204: no new events available", function () {
            const body = res.getBody();
            expect(body === undefined || body === null || body === '').to.be.true;
          });
        }

        if (res.getStatus() === 401) {
          test("401: returns problem+json error", function () {
            expect(res.getHeader('content-type')).to.include('application/problem+json');
            const body = res.getBody();
            expect(body).to.have.property('title').that.is.a('string');
            expect(body).to.have.property('status', 401);
          });
        }

